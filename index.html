<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Custom Memo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="group">
      <button id="newProjectBtn">새 프로젝트</button>
      <input id="projectNameInput" placeholder="프로젝트 이름" />
      <label class="file-label">지도 이미지<input id="mapImageInput" type="file" accept="image/*" /></label>
      <button id="loadProjectBtn">.mapproj 불러오기</button>
      <button id="saveProjectBtn">.mapproj 저장</button>
    </div>
    <div class="group">
      <span>모드</span>
      <button class="mode-btn" data-mode="view">View</button>
      <button class="mode-btn" data-mode="edit">Edit</button>
      <button class="mode-btn" data-mode="init-ruler">Init-Ruler</button>
      <span id="rulerInfo" class="warn"></span>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar left">
      <section>
        <h3>프로젝트 목록(세션)</h3>
        <ul id="projectList"></ul>
      </section>
      <section>
        <h3>레이어</h3>
        <button id="addMarkerLayerBtn">+ 마커 레이어</button>
        <button id="addTextLayerBtn">+ 텍스트 레이어</button>
        <ul id="layerList"></ul>
      </section>
    </aside>

    <section class="canvas-wrap">
      <canvas id="canvas" width="1280" height="720"></canvas>
      <div id="statusBar"></div>
    </section>

    <aside class="sidebar right">
      <section>
        <h3>뷰(휘발성)</h3>
        <label><input type="checkbox" id="quickToggle" checked /> 선택 레이어 빠른 표시</label>
        <label>빠른 투명도 <input type="range" id="quickAlpha" min="0" max="1" step="0.01" value="1" /></label>
        <div class="row">
          <button id="measureLineBtn">거리 재기</button>
          <button id="measureRadiusBtn">반경 원 재기</button>
          <button id="clearMeasureBtn">측정 지우기</button>
        </div>
      </section>
      <section>
        <h3>선택 레이어 속성</h3>
        <div id="layerEditor">레이어를 선택하세요.</div>
      </section>
      <section>
        <h3>선택 인스턴스 속성</h3>
        <div id="instanceEditor">인스턴스를 선택하세요.</div>
      </section>
    </aside>
  </main>

  <input id="loadProjectInput" type="file" accept=".mapproj,application/json" hidden />
  <script type="module" src="app.js"></script>
</body>
</html>
